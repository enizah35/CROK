# yaml-language-server: $schema=../recipe.schema.json
#
# MODÈLE DE RECETTE : copie ce fichier, renomme-le avec le slug (ex. riz-saute.yaml),
# puis remplace les valeurs. Les fichiers qui commencent par « _ » ne sont jamais publiés.
# Guide complet : docs/RECETTES.md
#
# Astuces VS Code (extension « YAML » de Red Hat) :
#   - Ctrl+Espace propose les champs et les valeurs possibles (unités, équipements…).
#   - Survole un champ pour lire son explication.
#   - Les erreurs sont soulignées en rouge pendant que tu écris.
# Vérifie ensuite avec : pnpm recipes:check

# Identifiant unique = nom du fichier sans .yaml. Minuscules, chiffres, tirets. Ne plus y toucher après publication.
slug: mon-plat

# Titre affiché dans l'app.
title: Mon plat du soir

# Nombre de portions pour lesquelles les quantités ci-dessous sont écrites (1 à 6).
servings_base: 2

# Durée totale en minutes, cuissons et attentes comprises.
total_min: 25

# Minutes où l'on s'active vraiment (couper, remuer). Toujours ≤ total_min.
active_min: 10

# Coût par portion en CENTIMES : 1,20 € = 120. Au-dessus de 250 (2,50 €), un avertissement s'affiche.
cost_cents_per_serving: 120

# Équipements nécessaires, parmi : plaques, four, micro_ondes.
equipment: [plaques]

# Mots-clés pour les filtres (minuscules, tirets). Facultatif.
tags: [vegetarien, express]

# Photo de couverture, placée dans content/covers/. Facultatif tant qu'elle n'existe pas.
# cover: mon-plat.jpg

# Passe à false pour garder la recette en brouillon (non visible dans l'app). Vaut true par défaut.
# published: false

# Ingrédients, dans l'ordre d'utilisation.
# Unités : g, ml, piece, cuillere_soupe, cuillere_cafe, pincee, au_gout (pas de kg ni de litre).
# Les nombres à virgule s'écrivent avec un POINT : 0.5
ingredients:
  - name: pâtes
    quantity: 200
    unit: g
    category: feculents
  - name: oignon
    quantity: 1
    unit: piece
    category: fruits_legumes
  - name: feuille de laurier
    quantity: 1
    unit: piece
    non_scalable: true # ne change pas avec le nombre de portions
  - name: sel
    unit: au_gout # pas de quantity avec au_gout

# Étapes : une action par étape, à l'impératif. Chaque étape s'affiche seule sur un écran.
# timer_sec : minuteur en SECONDES (300 = 5 min, 600 = 10 min). Facultatif.
# tip : astuce affichée sous l'étape. Facultatif.
steps:
  - text: Émince l'oignon finement.
  - text: Fais cuire les pâtes dans une grande casserole d'eau salée.
    timer_sec: 600
    tip: Goûte une pâte une minute avant la fin pour vérifier la cuisson.
