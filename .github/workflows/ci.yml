name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activer pnpm via corepack
        run: corepack enable

      - name: Cache du store pnpm
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci

  db:
    name: Base de données (migrations, pgTAP, types)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      # Seuls Postgres, l'auth, le stockage et l'API sont nécessaires aux migrations et aux tests.
      - name: Démarrer Supabase en local
        run: supabase start -x realtime,studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Tests pgTAP (RLS, contraintes, fonctions de temps)
        run: supabase db test

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activer pnpm via corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Types générés à jour
        run: |
          pnpm db:types
          git diff --exit-code packages/shared/src/database.types.ts
